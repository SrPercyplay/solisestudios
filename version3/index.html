<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solis Estudio | Versión 3 (Luz Natural & Editorial)</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/Logo%20Estudio.png">

    <!-- Fuente Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #fcfbf9;
            background-image: 
                linear-gradient(135deg, rgba(253, 252, 250, 0.85) 0%, rgba(245, 240, 235, 0.65) 100%),
                url('/Solis%20Estudio.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #2b2b2b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
        }

        /* 1. Header en Píldora Flotante Centrada */
        header {
            align-self: center;
            background-color: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 50px;
            padding: 12px 35px;
            display: flex;
            align-items: center;
            gap: 40px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            z-index: 1000;
        }

        .logo {
            font-size: 1.1rem;
            font-weight: 600;
            color: #b89726; /* Dorado Champagne */
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: #555555;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        nav a:hover, nav a.active {
            color: #b89726;
        }

        /* 2. Área Libre Central que Permite Apreciar la Ilustración */
        .editorial-viewport {
            flex-grow: 1;
        }

        /* 3. Panel Editorial Flotante Inferior (Ubicado en la esquina) */
        .editorial-card {
            max-width: 480px;
            background-color: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(212, 175, 55, 0.35);
            border-radius: 16px;
            padding: 30px 35px;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.06);
            align-self: flex-start;
            margin-top: 20px;
        }

        .editorial-card .badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 600;
            color: #b89726;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            margin-bottom: 12px;
            border-bottom: 1px solid #b89726;
            padding-bottom: 2px;
        }

        .editorial-card h1 {
            font-size: 1.6rem;
            font-weight: 300;
            color: #1a1a1a;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .editorial-card .subtitle {
            font-size: 0.88rem;
            font-style: italic;
            color: #777777;
            margin-bottom: 16px;
        }

        .editorial-card p {
            font-size: 0.85rem;
            line-height: 1.7;
            color: #4a4a4a;
            font-weight: 300;
            margin-bottom: 22px;
        }

        /* Botón Estilo Editorial Elegante */
        .btn-editorial {
            display: inline-block;
            padding: 10px 24px;
            background-color: #b89726;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 30px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(184, 151, 38, 0.25);
        }

        .btn-editorial:hover {
            background-color: #1a1a1a;
            color: #ffffff;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
            transform: translateY(-2px);
        }

        /* Adaptabilidad Móvil */
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            header {
                flex-direction: column;
                gap: 12px;
                border-radius: 20px;
                width: 100%;
                padding: 15px;
            }

            .editorial-card {
                max-width: 100%;
                align-self: center;
            }
        }
    </style>
</head>
<body>

    <!-- Navegación Flotante Estilo Píldora -->
    <header>
        <div class="logo">SOLIS ESTUDIO</div>
        <nav>
            <a href="/" class="active">Inicio</a>
            <a href="/servicios/">Servicios</a>
            <a href="/contacto/">Contacto</a>
        </nav>
    </header>

    <!-- Espacio Visor Central Libre -->
    <div class="editorial-viewport"></div>

    <!-- Tarjeta Inferior de Estilo Editorial -->
    <main class="editorial-card">
        <span class="badge">Luz Natural & Retrato</span>
        <h1>Percy Solis</h1>
        <div class="subtitle">Una fotografía, un recuerdo</div>
        <p>Fotógrafo y editor profesional formado en Lino Fotografía. Especializado en capturar momentos auténticos, bodas y narrativa visual con estética de luz natural.</p>
        <a href="/servicios/" class="btn-editorial">Descubrir Servicios</a>
    </main>

</body>
</html>
