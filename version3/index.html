<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solis Estudio | Versión 3 (Luz Natural & Minimalista)</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/Logo%20Estudio.png">

    <!-- Fuente Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,500;0,700;1,300&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        /* Fondo Claro, Luminoso y Elegante */
        body {
            background-color: #fbf9f6;
            background-image: 
                linear-gradient(rgba(251, 249, 246, 0.85), rgba(251, 249, 246, 0.85)),
                url('/Solis%20Estudio.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #2c2c2c;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Header claro con acento dorado sutil */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 50px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.05);
            z-index: 1000;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 300;
            color: #b89726; /* Dorado champagne */
            letter-spacing: 6px;
            text-transform: uppercase;
        }

        nav a {
            color: #4a4a4a;
            text-decoration: none;
            margin-left: 25px;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: #b89726;
        }

        /* Banner Superior */
        .hero {
            text-align: center;
            padding-top: 110px;
            padding-bottom: 10px;
        }

        .hero h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: #1a1a1a;
            text-transform: uppercase;
            letter-spacing: 5px;
        }

        .hero p {
            margin-top: 6px;
            font-size: 1rem;
            font-weight: 300;
            font-style: italic;
            color: #8c7320;
            letter-spacing: 3px;
        }

        /* Espacio libre central */
        .center-spacer {
            flex-grow: 1;
            min-height: 180px;
        }

        /* Tarjeta Inferior Estilo Minimalista / Bodas */
        .bottom-card {
            max-width: 650px;
            width: 90%;
            margin: 0 auto 30px auto;
            padding: 22px 25px;
            text-align: center;
            background-color: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 12px;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .bottom-card h2 {
            font-size: 1.1rem;
            font-weight: 500;
            color: #b89726;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .bottom-card p {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #4a4a4a;
            font-weight: 300;
            margin-bottom: 15px;
        }

        /* Botón de Acción Elegante Dorado */
        .btn-cta {
            display: inline-block;
            padding: 10px 24px;
            border: 1px solid #b89726;
            background-color: rgba(212, 175, 55, 0.1);
            color: #2c2c2c;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 30px;
            transition: all 0.3s ease;
        }

        .btn-cta:hover {
            background-color: #b89726;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(184, 151, 38, 0.3);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- Barra de navegación fija -->
    <header>
        <div class="logo">SOLIS ESTUDIO</div>
        <nav>
            <a href="/" class="active">Inicio</a>
            <a href="/servicios/">Servicios</a>
            <a href="/contacto/">Contacto</a>
        </nav>
    </header>

    <!-- Encabezado compacto superior -->
    <section class="hero">
        <h1>Fotografía y Edición</h1>
        <p>Una fotografía, un recuerdo</p>
    </section>

    <!-- Área libre central -->
    <div class="center-spacer"></div>

    <!-- Bloque inferior unificado -->
    <section class="bottom-card">
        <h2>Percy Solis</h2>
        <p>Fotógrafo y editor profesional formado en Lino Fotografía. Capturando historias únicas a través de la lente y el retoque digital.</p>
        <a href="/servicios/" class="btn-cta">Descubrir Servicios</a>
    </section>

</body>
</html>
