<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLIS ESTUDIO</title>
    <style>
        :root {
            --border-space: rgba(255, 255, 255, 0.1);
            --bg-color: #0f0f11;
            --text-color: #ffffff;
            --accent-color: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header & Navegación */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 15, 17, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid var(--border-space);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
        }

        .logo {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 30px;
            align-items: center;
        }

        .nav-link {
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        .nav-link:hover {
            color: var(--accent-color);
        }

        .dropdown {
            position: relative;
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            background: #18181c;
            border: 1px solid var(--border-space);
            padding: 10px 0;
            min-width: 160px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .dropdown:hover .dropdown-menu {
            opacity: 1;
            visibility: visible;
        }

        .dropdown-menu a {
            display: block;
            padding: 8px 20px;
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.85rem;
        }

        .dropdown-menu a:hover {
            background: var(--border-space);
        }

        /* Hero Section */
        .hero {
            padding-top: 180px;
            padding-bottom: 80px;
            min-height: 80vh;
            display: flex;
            align-items: center;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
        }

        .hero-text h1 {
            font-size: 3.8rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        /* Portfolio Section */
        .portfolio {
            padding: 80px 0;
        }

        .section-title {
            margin-bottom: 40px;
        }

        .section-title h2 {
            font-size: 2.5rem;
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        /* Contact Section */
        .contact {
            padding: 80px 0;
        }

        .contact-card {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #141417;
            border: 1px solid var(--border-space);
            border-radius: 12px;
            padding: 40px;
            gap: 40px;
        }

        .contact-info {
            border-right: 1px solid var(--border-space);
            padding-right: 40px;
        }

        /* REGLAS RESPONSIVAS PARA MÓVILES (REEMPLAZADO) */
        @media (max-width: 900px) {
            .container {
                padding: 0 15px;
            }

            .nav-container {
                flex-direction: column;
                gap: 12px;
                padding: 12px 0;
            }

            .nav-menu {
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
            }

            .nav-link {
                font-size: 0.75rem;
            }

            .dropdown-menu {
                position: static;
                opacity: 1;
                visibility: visible;
                width: 100%;
                background: transparent;
                border: none;
                box-shadow: none;
                padding: 5px 0 0 0;
                display: none;
            }

            .dropdown:hover .dropdown-menu {
                display: block;
            }

            .hero {
                padding-top: 130px;
                min-height: auto;
            }

            .hero-grid, .contact-card, .portfolio-grid {
                grid-template-columns: 1fr;
            }

            .hero-text h1 {
                font-size: clamp(2rem, 8vw, 2.8rem);
                line-height: 1.2;
            }

            .section-title h2 {
                font-size: 2rem;
            }

            .contact-info {
                border-right: none;
                border-bottom: 1px solid var(--border-space);
                padding-bottom: 30px;
                padding-right: 0;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="container nav-container">
            <div class="logo">SOLIS ESTUDIO</div>
            <ul class="nav-menu">
                <li><a href="#inicio" class="nav-link">Inicio</a></li>
                <li class="dropdown">
                    <a href="#servicios" class="nav-link">Servicios</a>
                    <div class="dropdown-menu">
                        <a href="#">Diseño Web</a>
                        <a href="#">Branding</a>
                    </div>
                </li>
                <li><a href="#portafolio" class="nav-link">Portafolio</a></li>
                <li><a href="#contacto" class="nav-link">Contacto</a></li>
            </ul>
        </div>
    </header>

    <main>
        <section id="inicio" class="hero container">
            <div class="hero-grid">
                <div class="hero-text">
                    <h1>Diseño visual & experiencia digital</h1>
                </div>
            </div>
        </section>

        <section id="portafolio" class="portfolio container">
            <div class="section-title">
                <h2>Proyectos</h2>
            </div>
            <div class="portfolio-grid">
                <!-- Tarjetas del portafolio -->
            </div>
        </section>

        <section id="contacto" class="contact container">
            <div class="contact-card">
                <div class="contact-info">
                    <h3>Contacto</h3>
                </div>
                <div class="contact-form">
                    <!-- Formulario de contacto -->
                </div>
            </div>
        </section>
    </main>

</body>
</html>
