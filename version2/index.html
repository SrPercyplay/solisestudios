<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solis Estudio | Versión 2 (Cuarto Oscuro)</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/Logo%20Estudio.png">

    <!-- Fuente Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,500;0,700;1,300&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        /* Fondo Oscuro con atmósfera de laboratorio analógico / luz roja */
        body {
            background-color: #0a0a0a;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(180, 0, 0, 0.25) 0%, rgba(10, 10, 10, 0.95) 70%),
                url('/Solis%20Estudio.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Header en tonalidad oscura con resplandor rojo tenue */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(12, 12, 12, 0.95);
            border-bottom: 1px solid rgba(220, 20, 60, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 50px;
            box-shadow: 0 4px 20px rgba(180, 0, 0, 0.15);
            z-index: 1000;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 300;
            color: #ff2a2a;
            letter-spacing: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 42, 42, 0.5);
        }

        nav a {
            color: #cccccc;
            text-decoration: none;
            margin-left: 25px;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 1px;
            transition: color 0.3s, text-shadow 0.3s;
        }

        nav a:hover, nav a.active {
            color: #ff2a2a;
            text-shadow: 0 0 8px rgba(255, 42, 42, 0.6);
        }

        /* Banner Superior (Manteniendo el área central despejada) */
        .hero {
            text-align: center;
            padding-top: 110px;
            padding-bottom: 10px;
        }

        .hero h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95), 0 0 15px rgba(255, 42, 42, 0.7);
        }

        .hero p {
            margin-top: 6px;
            font-size: 1rem;
            font-weight: 300;
            font-style: italic;
            color: #ffb000; /* Tono Ámbar revelado */
            letter-spacing: 3px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95), 0 0 8px rgba(255, 176, 0, 0.4);
        }

        /* Espacio libre central */
        .center-spacer {
            flex-grow: 1;
            min-height: 180px;
        }

        /* Tarjeta Inferior Estilo Revelado */
        .bottom-card {
            max-width: 650px;
            width: 90%;
            margin: 0 auto 30px auto;
            padding: 20px 25px;
            text-align: center;
            background-color: rgba(15, 10, 10, 0.75);
            border: 1px solid rgba(255, 42, 42, 0.35);
            border-radius: 12px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 20px rgba(180, 0, 0, 0.2);
        }

        .bottom-card h2 {
            font-size: 1.1rem;
            font-weight: 500;
            color: #ff2a2a;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 8px rgba(255, 42, 42, 0.5);
        }

        .bottom-card p {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #e0e0e0;
            font-weight: 300;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.9);
            margin-bottom: 15px;
        }

        /* Botón de Acción estilo luz roja / ámbar */
        .btn-cta {
            display: inline-block;
            padding: 10px 24px;
            border: 1px solid #ff2a2a;
            background-color: rgba(255, 42, 42, 0.15);
            color: #ffffff;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 30px;
            transition: all 0.3s ease;
        }

        .btn-cta:hover {
            background-color: #ff2a2a;
            color: #0a0a0a;
            box-shadow: 0 0 20px rgba(255, 42, 42, 0.7);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- Barra de navegación fija -->
    <header>
        <div class="logo">SOLIS ESTUDIO</div>
        <nav>
            <a href="/" class="active">Inicio</a>
            <a href="/servicios/">Servicios</a>
            <a href="/contacto/">Contacto</a>
        </nav>
    </header>

    <!-- Encabezado compacto superior -->
    <section class="hero">
        <h1>Fotografía y Edición</h1>
        <p>Una fotografía, un recuerdo</p>
    </section>

    <!-- Área libre central -->
    <div class="center-spacer"></div>

    <!-- Bloque inferior unificado -->
    <section class="bottom-card">
        <h2>Percy Solis</h2>
        <p>Fotógrafo y editor profesional formado en Lino Fotografía. Capturando historias únicas a través de la lente y el retoque digital.</p>
        <a href="/servicios/" class="btn-cta">Descubrir Servicios</a>
    </section>

</body>
</html>
