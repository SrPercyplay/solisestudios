<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solis Estudio | Versión 2 (Cuarto Oscuro)</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/Logo%20Estudio.png">

    <!-- Fuente Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,500;0,700;1,300&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #080808;
            background-image: 
                radial-gradient(circle at 75% 50%, rgba(180, 0, 0, 0.25) 0%, rgba(8, 8, 8, 0.95) 75%),
                url('/Solis%20Estudio.png');
            background-size: cover;
            background-position: center right;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
        }

        /* Contenedor Principal en Disposición Dividida (Split Layout) */
        .app-container {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        /* Panel Lateral Izquierdo (Sustituye la barra superior tradicional) */
        .sidebar-panel {
            width: 420px;
            max-width: 90vw;
            background-color: rgba(12, 10, 10, 0.82);
            border-right: 1px solid rgba(255, 42, 42, 0.3);
            backdrop-filter: blur(12px);
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }

        /* Logo en el Panel Lateral */
        .brand-header .logo {
            font-size: 1.5rem;
            font-weight: 300;
            color: #ff2a2a;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(255, 42, 42, 0.6);
            margin-bottom: 8px;
        }

        .brand-header .tagline {
            font-size: 0.8rem;
            color: #ffb000;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* Menú Vertical */
        .nav-vertical {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 40px 0;
        }

        .nav-vertical a {
            color: #a0a0a0;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-vertical a::before {
            content: '//';
            color: rgba(255, 42, 42, 0.4);
            font-size: 0.8rem;
            transition: color 0.3s ease;
        }

        .nav-vertical a:hover, .nav-vertical a.active {
            color: #ffffff;
            padding-left: 8px;
        }

        .nav-vertical a:hover::before, .nav-vertical a.active::before {
            color: #ff2a2a;
        }

        /* Tarjeta Biografía Integrada en el Panel */
        .bio-card {
            border-left: 2px solid #ff2a2a;
            padding-left: 18px;
            margin-bottom: 30px;
        }

        .bio-card h2 {
            font-size: 1.1rem;
            color: #ff2a2a;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .bio-card p {
            font-size: 0.85rem;
            line-height: 1.6;
            color: #cccccc;
            font-weight: 300;
        }

        /* Botón de Acción */
        .btn-cta {
            display: inline-block;
            text-align: center;
            padding: 14px 28px;
            border: 1px solid #ff2a2a;
            background-color: rgba(255, 42, 42, 0.15);
            color: #ffffff;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .btn-cta:hover {
            background-color: #ff2a2a;
            color: #080808;
            box-shadow: 0 0 20px rgba(255, 42, 42, 0.7);
        }

        /* Visor de Arte a la Derecha */
        .main-viewport {
            flex: 1;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            padding: 40px;
            position: relative;
        }

        /* Indicador Técnico Estilo Cuarto Oscuro */
        .tech-tag {
            background-color: rgba(8, 8, 8, 0.7);
            border: 1px solid rgba(255, 176, 0, 0.4);
            color: #ffb000;
            padding: 8px 16px;
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            backdrop-filter: blur(4px);
            border-radius: 3px;
        }

        /* Adaptación para pantallas móviles */
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }
            .sidebar-panel {
                width: 100%;
                max-width: 100%;
                border-right: none;
                border-bottom: 1px solid rgba(255, 42, 42, 0.3);
            }
            .main-viewport {
                min-height: 300px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Panel Lateral de Navegación y Contenido -->
        <aside class="sidebar-panel">
            <div class="brand-header">
                <div class="logo">Solis Estudio</div>
                <div class="tagline">Una fotografía, un recuerdo</div>
            </div>

            <nav class="nav-vertical">
                <a href="/" class="active">Inicio</a>
                <a href="/servicios/">Servicios</a>
                <a href="/contacto/">Contacto</a>
            </nav>

            <div class="bio-card">
                <h2>Percy Solis</h2>
                <p>Fotógrafo y editor profesional formado en Lino Fotografía. Especializado en captura analógica, retoque digital y composición estética.</p>
            </div>

            <a href="/servicios/" class="btn-cta">Ver Servicios</a>
        </aside>

        <!-- Visor Despejado que Muestra la Ilustración de Fondo -->
        <main class="main-viewport">
            <div class="tech-tag">DARKROOM // ANALOG PROCESS</div>
        </main>
    </div>

</body>
</html>
